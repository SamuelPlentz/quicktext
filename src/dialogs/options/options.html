<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <script src="options.js" type="module"></script>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
      margin: 0;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.5;
    }

    fieldset {
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 4px;
      padding: 12px 14px;
      margin: 0 0 16px;
    }

    legend {
      padding: 0 4px;
      font-weight: 600;
    }

    fieldset label {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    fieldset p {
      margin: 10px 0 0;
      opacity: 0.85;
    }

    .options-button {
      padding: 8px 18px;
      background: #2a7fd4;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .options-button:hover {
      background: #1a6abf;
    }

    @media (prefers-color-scheme: dark) {
      .options-button {
        background: #1a6abf;
      }

      .options-button:hover {
        background: #2a7fd4;
      }
    }

  </style>
</head>

<body>
  <p id="intro" data-i18n-content="quicktext.options.intro"></p>

  <fieldset>
    <legend id="lbl-remote-requests" data-i18n-content="quicktext.remoteRequests.legend"></legend>
    <label>
      <input type="checkbox" id="chk-remote-requests">
      <span id="lbl-chk-remote-requests" data-i18n-content="quicktext.remoteRequests.label"></span>
    </label>
    <p id="remote-requests-disclosure" data-i18n-content="quicktext.remoteRequests.description"></p>
  </fieldset>

  <div style="text-align:center">
    <button class="options-button" id="open-settings" data-i18n-content="quicktext.settings.title"></button>
  </div>

</body>

</html>
