<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title></title>
  <link rel="icon" href="/assets/icon.png" />
  <link rel="stylesheet" href="migration.css" />
  <script src="migration.js" type="module"></script>
</head>

<body>
  <h1 id="page-title"></h1>
  <div id="intro"></div>
  <blockquote id="author-quote" class="author-quote" hidden></blockquote>

  <div id="top-actions">
    <button id="btn-open-manager" class="secondary" data-i18n-content="quicktext.settings.title"></button>
    <button id="btn-wiki-storage" class="secondary" data-i18n-content="migration.btn.learnStorage"></button>
    <button id="btn-wiki-journey" class="secondary" data-i18n-content="migration.btn.learnJourney"></button>
  </div>

  <h2 id="auto-header" class="section-header" hidden data-i18n-content="migration.section.autoMigration"></h2>
  <div id="auto-intro" class="auto-intro" hidden data-i18n-content="migration.auto.intro"></div>
  <section id="auto-section" class="card" hidden>
    <div id="auto-list"></div>
  </section>
  <div id="auto-actions" hidden>
    <button id="btn-migrate" disabled data-i18n-content="migration.btn.startMigration"></button>
  </div>

  <h2 id="manual-header" class="section-header" hidden data-i18n-content="migration.section.manualMigration"></h2>
  <div id="manual-intro" class="manual-intro" hidden data-i18n-content="migration.manual.intro"></div>

  <section id="manual-incompatible" class="card" hidden>
    <h3 data-i18n-content="migration.incompatible.title"></h3>
    <p id="incompatible-description"></p>
    <div id="manual-incompatible-list"></div>
    <p id="manual-incompatible-readonly-note" hidden></p>
  </section>

  <section id="manual-filesystem" class="card" hidden>
    <h3 data-i18n-content="migration.filesystem.title"></h3>
    <p id="filesystem-description"></p>
    <div id="manual-filesystem-list"></div>
    <p id="manual-filesystem-readonly-note" hidden></p>
  </section>

  <h2 id="dropped-header" class="section-header" hidden data-i18n-content="migration.section.droppedSources"></h2>
  <div id="dropped-intro" class="manual-intro" hidden data-i18n-content="migration.dropped.intro"></div>
  <section id="dropped-section" class="card" hidden>
    <div id="dropped-list"></div>
    <p id="dropped-description"></p>
  </section>
  <div id="dropped-actions" hidden>
    <button id="btn-dropped-ok" data-i18n-content="migration.btn.dontShowAgain"></button>
  </div>
</body>

</html>
